experiment:
  name: "datm_phase_d_sensitivity"
  editable_files: ["phase_d_experiment.py"]
  readonly_files: []
  run_command: "python phase_d_experiment.py"
  timeout_seconds: 300
  metric_name: "phase_d_mean_f1"
  metric_direction: "maximize"
  max_experiments: 50
  convergence_window: 5
  convergence_threshold: 0.001
  results_file: "results_d.tsv"
  work_dir: "."

git:
  enabled: false
  auto_create_branch: false
